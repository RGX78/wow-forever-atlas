<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas — WoW Forever</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{--bg:#0c0d11;--panel:#13151b;--panel2:#181b22;--line:#262a33;--txt:#e9e7e3;--dim:#8b909c;
 --gold:#c8a24a;--gold2:#e6c579;--taxi:#4fc3f7;--quest:#ffd166;--vendor:#7bd88f;--npc:#9aa5b1;
 --ally:#4a90e2;--horde:#e05252}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:296px 1fr;height:100vh}
/* ---------- sidebar ---------- */
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:17px;letter-spacing:.2px}
.brand h1 span{color:var(--gold)}
.brand p{margin:4px 0 0;font-size:11.5px;color:var(--dim)}
.search{padding:10px 12px;border-bottom:1px solid var(--line)}
.search input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
 padding:8px 11px;font:inherit;font-size:13px;outline:none}
.search input:focus{border-color:#3c4250}
.list{overflow-y:auto;flex:1;padding:6px 8px 12px}
.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:#2b303a;border-radius:4px}
.grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:12px 8px 5px;display:flex;justify-content:space-between}
.grp b{color:#5f6672;font-weight:500}
.z{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:13px;color:#cfd3da}
.z:hover{background:#1b1f27}
.z.on{background:linear-gradient(180deg,#262117,#1b1a14);color:var(--gold2);font-weight:600;box-shadow:inset 0 0 0 1px #3a3320}
.z .dot2{width:6px;height:6px;border-radius:50%;background:#3a4150;flex:0 0 6px}
.z.on .dot2{background:var(--gold)}
.z .cnt{margin-left:auto;font-size:10.5px;color:#6b7280;font-variant-numeric:tabular-nums}
.z.on .cnt{color:#a8894a}
aside footer{padding:9px 14px;border-top:1px solid var(--line);font-size:10.5px;color:#5d6470;line-height:1.5}
/* ---------- map ---------- */
main{position:relative;min-width:0;background:#0a0b0e}
#map{position:absolute;inset:0;background:radial-gradient(900px 500px at 50% 10%,#171922,#0a0b0e 70%)}
.leaflet-container{background:transparent;font:inherit}
.topbar{position:absolute;z-index:1200;left:14px;right:14px;top:12px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;
 pointer-events:none}
.topbar>*{pointer-events:auto}
.title{background:rgba(17,19,25,.92);border:1px solid var(--line);border-radius:10px;padding:8px 13px;backdrop-filter:blur(6px)}
.title h2{margin:0;font-size:15.5px;letter-spacing:.2px}
.title p{margin:2px 0 0;font-size:11px;color:var(--dim)}
.chips{display:flex;gap:6px;background:rgba(17,19,25,.92);border:1px solid var(--line);border-radius:10px;padding:6px;backdrop-filter:blur(6px)}
.chip{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:#171a21;color:#aeb4bf;
 border-radius:7px;padding:4px 8px;font-size:11.5px;cursor:pointer;user-select:none}
.chip .d{width:8px;height:8px;border-radius:50%}
.chip.on{background:#22262f;color:#fff;border-color:#39404d}
.chip.off{opacity:.4}
.pinsearch{position:relative;background:rgba(17,19,25,.92);border:1px solid var(--line);border-radius:10px;padding:6px 8px;backdrop-filter:blur(6px)}
.pinsearch input{background:transparent;border:0;outline:none;color:var(--txt);font:inherit;font-size:12.5px;width:190px}
.results{position:absolute;top:100%;left:0;right:0;margin-top:6px;background:#12151b;border:1px solid var(--line);
 border-radius:9px;max-height:290px;overflow:auto;box-shadow:0 12px 30px #000a;display:none}
.results.on{display:block}
.results div{padding:6px 10px;font-size:12.5px;cursor:pointer;display:flex;gap:8px;align-items:center}
.results div:hover{background:#1b1f27}
.results small{color:var(--dim);margin-left:auto;font-size:10.5px;white-space:nowrap}
.legend{position:absolute;z-index:1200;left:14px;bottom:14px;background:rgba(17,19,25,.92);border:1px solid var(--line);
 border-radius:10px;padding:8px 12px;font-size:11px;color:#a8aebb;display:flex;gap:12px;flex-wrap:wrap;backdrop-filter:blur(6px)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.leaflet-control-zoom a{background:#171a21!important;color:#cfd3da!important;border-color:var(--line)!important}
.leaflet-control-zoom a:hover{background:#22262f!important;color:#fff!important}
.pin{display:flex;align-items:center;justify-content:center}
.pin .d{width:11px;height:11px;border-radius:50%;border:1.5px solid #0b0c10;box-shadow:0 0 0 1px #0006,0 0 6px #0008}
.pin.k-taxi .d{background:var(--taxi)}
.pin.k-quest .d{background:var(--quest)}
.pin.k-vendor .d{background:var(--vendor)}
.pin.k-npc .d{background:var(--npc)}
.pin.f-alliance .d{border-color:var(--ally)}
.pin.f-horde .d{border-color:var(--horde)}
.pin.f-both .d{border-color:#b06ad6}
.pin:hover .d{transform:scale(1.7);transition:transform .12s}
.leaflet-tooltip.pin-tip{background:#101319;border:1px solid #2f3542;color:#e6e8ec;font-size:11.5px;padding:3px 7px;border-radius:6px;box-shadow:0 6px 16px #000a}
.leaflet-tooltip.pin-tip:before{display:none}
/* grid */
.gridwrap{position:absolute;inset:0;z-index:1300;background:rgba(8,9,12,.94);backdrop-filter:blur(4px);overflow:auto;padding:18px;display:none}
.gridwrap.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;max-width:1200px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:#3d3a2a}
.card img{width:100%;height:104px;object-fit:cover;display:block;filter:saturate(.9)}
.card .cap{padding:7px 10px;font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
.card .cap small{color:var(--dim)}
.closegrid{position:sticky;top:0;float:right;background:#1b1f27;border:1px solid var(--line);color:#cfd3da;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:12px;z-index:2}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  aside{position:absolute;z-index:800;inset:0 auto 0 0;width:290px;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none;box-shadow:0 0 40px #000c}
  .burger{position:absolute;z-index:790;left:12px;bottom:12px;background:#171a21;border:1px solid var(--line);color:#cfd3da;border-radius:9px;padding:9px 12px;font-size:16px}
}
</style>
</head>

</div>

/* ---------- lista stref ---------- */
function renderList(filter){
  const f = (filter||"").toLowerCase();
  const box = document.getElementById('list');
  box.innerHTML = "";
  const groups = {};
  DATA.forEach(z=>{ (groups[z.g] = groups[z.g]||[]).push(z); });
  Object.keys(GRP).forEach(g=>{
    const arr = (groups[g]||[]).filter(z=>!f || z.n.toLowerCase().includes(f));
    if(!arr.length) return;
    const h = document.createElement('div'); h.className='grp';
    h.innerHTML = `<span>${GRP[g]}</span><b>${arr.length}</b>`; box.appendChild(h);
    arr.forEach(z=>{
      const d = document.createElement('div');
      d.className = 'z' + (cur && cur.s===z.s ? ' on':'');
      d.innerHTML = `<span class="dot2"></span><span>${z.n}</span><span class="cnt">${z.p.length||''}</span>`;
      d.onclick = ()=>{ select(z.s); document.getElementById('side').classList.remove('open'); };
      box.appendChild(d);
    });
  });
}

/* ---------- piny ---------- */
function iconFor(p){
  const c = 'pin k-'+p.k+(p.f?' f-'+p.f:'');
  return L.divIcon({className:c, html:'<span class="d"></span>', iconSize:[11,11], iconAnchor:[5.5,5.5]});
}
function drawPins(){
  if(layer){ map.removeLayer(layer); layer = null; markers = []; }
  if(!cur || hidePins) return;
  layer = L.layerGroup().addTo(map);
  cur.p.forEach(p=>{
    if(!kinds[p.k]) return;
    if(faction!=='all' && p.f!==faction) return;
    const m = L.marker([ (1-p.y)*cur.h, p.x*cur.w ], {icon:iconFor(p), keyboard:false});
    m.bindTooltip(p.n, {direction:'top', offset:[0,-6], className:'pin-tip'});
    m.addTo(layer); markers.push({m, p});
  });
}

/* ---------- strefa ---------- */
function select(slug, fly){
  const z = DATA.find(x=>x.s===slug) || DATA[0];
  cur = z;
  if(!layerImg){ layerImg = L.imageOverlay(z.i, [[0,0],[z.h,z.w]]).addTo(map); }
  else layerImg.setUrl(z.i), layerImg.setBounds([[0,0],[z.h,z.w]]);
  requestAnimationFrame(()=>{ map.invalidateSize(); map.fitBounds([[0,0],[z.h,z.w]], {padding:[8,8], animate:false}); });
  document.getElementById('zt').textContent = z.n;
  document.getElementById('zp').textContent = `${GRP[z.g]} · ${z.p.length} pinów${z.p.length?' · kliknij pin, aby zobaczyć nazwę':''}`;
  drawPins(); renderList(document.getElementById('q').value);
  localStorage.setItem('atlas.zone', slug);
  if(fly) map.flyToBounds([[0,0],[z.h,z.w]], {padding:[10,10], duration:.4});
}
let layerImg = null;
window.addEventListener('resize', ()=>{ map.invalidateSize(); if(cur) map.fitBounds([[0,0],[cur.h,cur.w]], {padding:[8,8], animate:false}); });

/* ---------- filtry ---------- */
const chips = document.getElementById('chips');
KINDS.forEach(([k,label,color])=>{
  const c = document.createElement('div'); c.className='chip on'; c.dataset.k=k;
  c.innerHTML = `<span class="d" style="background:${color}"></span>${label}`;
  c.onclick = ()=>{ kinds[k]=!kinds[k]; c.classList.toggle('on',kinds[k]); c.classList.toggle('off',!kinds[k]); drawPins(); };
  chips.appendChild(c);
});
const hid = document.createElement('div'); hid.className='chip'; hid.textContent='ukryj piny';
hid.onclick = ()=>{ hidePins=!hidePins; hid.classList.toggle('on',hidePins); drawPins(); };
chips.appendChild(hid);
const fac = document.createElement('div'); fac.className='chip'; fac.textContent='frakcja: wszystkie';
fac.onclick = ()=>{ const seq=['all','alliance','horde','both']; faction = seq[(seq.indexOf(faction)+1)%seq.length];
  fac.textContent = 'frakcja: ' + ({all:'wszystkie',alliance:'Alliance',horde:'Horde',both:'obie'})[faction]; drawPins(); };
chips.appendChild(fac);

/* ---------- szukanie pinow ---------- */
const pq = document.getElementById('pq'), res = document.getElementById('res');
pq.addEventListener('input', ()=>{
  const q = pq.value.trim().toLowerCase();
  if(q.length<2){ res.classList.remove('on'); return; }
  const out = [];
  DATA.forEach(z=>z.p.forEach(p=>{ if(p.n.toLowerCase().includes(q)) out.push({z,p}); }));
  res.innerHTML = out.slice(0,40).map(({z,p},i)=>`<div data-i="${i}"><span class="d" style="width:7px;height:7px;border-radius:50%;background:${{taxi:'#4fc3f7',quest:'#ffd166',vendor:'#7bd88f',npc:'#9aa5b1'}[p.k]}"></span>${p.n}<small>${z.n}</small></div>`).join('')
    || '<div style="color:#8b909c">brak trafień</div>';
  res.classList.add('on');
  res.querySelectorAll('div[data-i]').forEach(d=>{
    d.onclick = ()=>{ const it = out[+d.dataset.i]; goTo(it.z, it.p); res.classList.remove('on'); pq.value=''; };
  });
});
function goTo(z, p){
  if(cur.s!==z.s) select(z.s);
  setTimeout(()=>{
    const ll = [ (1-p.y)*z.h, p.x*z.w ];
    map.flyTo(ll, 1.25, {duration:.5});
    setTimeout(()=>{
      const hit = markers.find(x=>Math.abs(x.m.getLatLng().lat-ll[0])<1 && Math.abs(x.m.getLatLng().lng-ll[1])<1);
      if(hit) hit.m.openTooltip();
    }, 520);
  }, 60);
}
document.addEventListener('click', e=>{ if(!e.target.closest('.pinsearch')) res.classList.remove('on'); });

/* ---------- siatka ---------- */
const grid = document.getElementById('grid'), gw = document.getElementById('gridwrap');
grid.innerHTML = DATA.map(z=>`<div class="card" data-s="${z.s}"><img loading="lazy" src="${z.t}" alt=""><div class="cap"><span>${z.n}</span><small>${z.p.length}</small></div></div>`).join('');
grid.querySelectorAll('.card').forEach(c=>c.onclick = ()=>{ gw.classList.remove('on'); select(c.dataset.s); });
document.getElementById('closegrid').onclick = ()=>gw.classList.remove('on');
let gBtn = document.createElement('div'); gBtn.className='chip'; gBtn.textContent='siatka stref';
gBtn.onclick = ()=>gw.classList.add('on'); chips.appendChild(gBtn);

/* ---------- reszta ---------- */
document.getElementById('q').addEventListener('input', e=>renderList(e.target.value));
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  const arr = DATA.map(z=>z.s), i = arr.indexOf(cur.s);
  if(e.key==='ArrowRight') select(arr[(i+1)%arr.length]);
  if(e.key==='ArrowLeft') select(arr[(i-1+arr.length)%arr.length]);
});
document.getElementById('burger').onclick = ()=>document.getElementById('side').classList.toggle('open');
if(window.innerWidth<=880) document.getElementById('burger').style.display='block';

const start = localStorage.getItem('atlas.zone');
select(start && DATA.some(z=>z.s===start) ? start : 'elwynn-forest');
</script>
</body></html>
